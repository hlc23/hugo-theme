<button
  type="button"
  class="theme-toggle flex items-center justify-center w-9 h-9 rounded-full border border-neutral-200 dark:border-neutral-800 text-neutral-500 dark:text-neutral-400 hover:text-neutral-900 dark:hover:text-neutral-100 transition-colors"
  aria-label="{{ i18n "toggleTheme" }}"
  title="{{ i18n "toggleTheme" }}"
  onclick="(function(){
    var html = document.documentElement;
    var next = html.classList.contains('dark') ? 'light' : 'dark';
    html.classList.toggle('dark', next === 'dark');
    try { localStorage.setItem('theme', next); } catch (e) {}
  })()"
>
  <span class="block dark:hidden">{{ partial "utils/icon" "moon" }}</span>
  <span class="hidden dark:block">{{ partial "utils/icon" "sun" }}</span>
</button>
